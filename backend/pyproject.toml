[project]
name = "recipe-app-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "James Armbrust",email = "jarmbrust@users.noreply.github.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.0,<2.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "loguru (>=0.7.3,<0.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "freezegun (>=1.5.5,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"

